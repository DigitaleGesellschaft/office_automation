name: Dependabot auto-merge

# Enables GitHub's native auto-merge on Dependabot pull requests so they merge
# themselves once all merge requirements on `main` are met (currently: the
# required `actionlint` status check, see lint.yml). This workflow only
# *requests* the merge - GitHub performs the merge itself and never before the
# requirements pass.
#
# Scope: patch and minor version bumps, plus any security update. Major
# version bumps are left for manual review.
#
# Repository settings this depends on (cannot be configured via repo files):
# 1. Settings → General → Pull Requests → "Allow auto-merge" enabled.
# 2. Branch protection ruleset on `main` requiring the `actionlint` check
#    (without any merge requirement, auto-merge would merge immediately).
# 3. Settings → Actions → General → "Allow GitHub Actions to create and
#    approve pull requests" (so the approval step can count as a review if
#    reviews ever become required; tolerated if disabled).

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # dependabot[bot]; matched by user ID, since logins are user-controlled
    # strings that could be spoofed
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve pull request
        # Approving lets this run also satisfy a future "require approvals"
        # rule. Tolerated failure: the GITHUB_TOKEN may not be allowed to
        # approve pull requests (Settings → Actions → General), and no review
        # is currently required anyway.
        continue-on-error: true
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.ghsa-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve

      - name: Enable auto-merge (squash)
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.ghsa-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash