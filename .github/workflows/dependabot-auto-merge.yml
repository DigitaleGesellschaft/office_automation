name: Dependabot auto-merge

# Enables GitHub's native auto-merge on Dependabot pull requests so they merge
# themselves once all merge requirements on `main` are met (currently: the
# required `jactionlint` and `zizmor` status checks, see `lint.yml`). This
# workflow only *requests* the merge – GitHub performs the merge itself and
# never before the requirements pass.
#
# The head branch is deleted in this same run right after the merge completes:
# the merge is carried out by GitHub's auto-merge machinery on behalf of
# `GITHUB_TOKEN`, and GitHub never runs workflows for `GITHUB_TOKEN`-triggered
# events (anti-recursion rule), so a `pull_request.closed`-based cleanup
# workflow could never fire for these merges.
#
# Scope: patch and minor version bumps, plus any security update. Major
# version bumps are left for manual review.
#
# Repository settings this depends on (cannot be configured via repo files):
# 1. Settings → General → Pull Requests → "Allow auto-merge" enabled.
# 2. Branch protection ruleset on `main` requiring the `jactionlint` and
#    `zizmor` checks (without any merge requirement, auto-merge would merge
#    immediately).
# 3. Settings → Actions → General → "Allow GitHub Actions to create and
#    approve pull requests" (so the approval step can count as a review if
#    reviews ever become required; tolerated if disabled).

on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    # dependabot[bot]; matched by user ID, since logins are user-controlled
    # strings that could be spoofed
    if: github.event.pull_request.user.id == 49699333
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve pull request
        # Approving lets this run also satisfy a future "require approvals"
        # rule. Tolerated failure: the GITHUB_TOKEN may not be allowed to
        # approve pull requests (Settings → Actions → General), and no review
        # is currently required anyway.
        continue-on-error: true
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.ghsa-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve

      - name: Enable auto-merge (rebase) and delete head branch after merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.metadata.outputs.ghsa-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr merge "$PR_URL" --auto --rebase
          state=OPEN
          for _ in {1..24}; do
            sleep 15
            state="$(gh pr view "$PR_URL" --json state --jq .state)"
            [ "$state" = OPEN ] || break
          done
          if [ "$state" != MERGED ]; then
            echo "::warning::Pull request not merged after ~6 min (state: ${state:-unknown}); leaving head branch '$HEAD_REF' alone."
            exit 0
          fi
          ref="repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
          if err="$(gh api --method DELETE "$ref" 2>&1)"; then
            echo "Deleted head branch '$HEAD_REF'."
          elif grep -q '(HTTP 404)' <<<"$err"; then
            echo "Head branch '$HEAD_REF' was already deleted (e.g. by Dependabot's own post-merge cleanup)."
          else
            echo "::warning::Could not delete head branch '$HEAD_REF' ($err)."
          fi
