name: Lint workflows

# Validates all GitHub Actions workflow files on pull requests and pushes to
# `main`:
# - jactionlint: workflow syntax, expression and shell checks, plus GitHub
#   Actions security audits (superset of actionlint; implements zizmor's
#   audits)
# - zizmor: GitHub Actions security audit with confidence grading, offline
#   archived-repository detection and Dependabot config audits
#
# NOTE: The job IDs `jactionlint` and `zizmor` are the names of the status
# checks required on `main` (branch protection ruleset) for the Dependabot
# auto-merge setup (see dependabot-auto-merge.yml). Renaming these jobs
# breaks that setup.

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jactionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/jactionlint@a65ab044e916760429068fe5794b8306abdfcbb9 # v2.3.0

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Fail the job on findings; the default SARIF/Advanced Security mode
          # reports without failing and is not needed for gating this check.
          advanced-security: false
          annotations: true
          # Block on everything but informational notes
          min-severity: low
