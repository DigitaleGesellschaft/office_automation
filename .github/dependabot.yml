version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Buffer so that (auto-)merges don't adopt a version right after its
    # release; also required by the dependabot-cooldown audit
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    reviewers:
      - "salim-b"
    commit-message:
      prefix: "ci"
      prefix-development: "ci-dev"
      include: "scope"
